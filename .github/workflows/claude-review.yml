name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]
    branches: [develop]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    # Chunked reviewing costs wall-clock: measured ~60s per chunk plus ~55s of setup, so
    # the 12-chunk cap needs ~13 minutes. At the previous 10 minutes a 9-chunk PR finished
    # in 9m26s — 34 seconds of headroom — and anything larger would have been killed
    # mid-review, producing no review at all. That is strictly worse than the truncated
    # review this replaced, so the timeout is raised to cover the cap rather than the cap
    # lowered to fit the timeout.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          # Computed locally rather than via `gh pr diff`, which reads the REST
          # diff endpoint and returns HTTP 406 "diff exceeded the maximum number
          # of lines (20000)" on a large PR — failing the whole job before the
          # review could run, on exactly the PRs most worth reviewing. The
          # checkout above already uses fetch-depth: 0, so the full history is
          # present and git can produce the same diff with no cap.
          #
          # --merge-base matches what GitHub shows: changes this branch
          # introduces, excluding commits the base gained since the fork.
          git fetch --quiet origin "$BASE_REF"
          git diff --merge-base "origin/$BASE_REF" HEAD > /tmp/pr_diff.txt

          DIFF_SIZE=$(wc -c < /tmp/pr_diff.txt | tr -d ' ')
          TOTAL_LINES=$(wc -l < /tmp/pr_diff.txt | tr -d ' ')
          echo "size=$DIFF_SIZE" >> $GITHUB_OUTPUT
          echo "total_lines=$TOTAL_LINES" >> $GITHUB_OUTPUT

      - name: Dismiss previous reviews
        if: steps.diff.outputs.size > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEWS=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --jq '.[] | select(.user.login == "github-actions[bot]") | .id')
          for REVIEW_ID in $REVIEWS; do
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews/$REVIEW_ID/dismissals \
              --method PUT -f message="Superseded by new review" || true
          done

      - name: Run Claude Review
        id: review
        if: steps.diff.outputs.size > 0
        env:
          CLAUDE_CODE_USE_BEDROCK: "1"
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.CLAUDE_REVIEW_TOKEN }}
          AWS_REGION: us-east-1
        run: |
          # Reviewed in chunks rather than `head -n 3000`.
          #
          # Trimming to the first 3,000 lines meant a large PR was reviewed at ~13% (3,000
          # of 23,699 lines on the PR that prompted this) while the job could still return
          # APPROVE — which reads as "reviewed and clean" when most of the change was never
          # sent. Chunks split on `diff --git` boundaries so each one is a whole-file diff.
          # 12 chunks is a deliberate ceiling on both spend and wall-clock: ~36,000 diff
          # lines reviewed, roughly $1 per run at Sonnet-class input pricing, inside the
          # 20-minute job timeout. A PR past that is too large to review well by any means
          # and should be split — the review says so explicitly rather than quietly
          # covering 13% of it, which is what `head -n 3000` used to do.
          #
          # A PR under 3,000 lines produces exactly one chunk and costs what it always did,
          # so the extra spend lands only on the PRs where a partial review is most
          # misleading.
          CHUNK_INFO=$(python3 .github/scripts/split-diff.py /tmp/pr_diff.txt /tmp/chunks 3000 12)
          CHUNK_COUNT=$(echo "$CHUNK_INFO" | sed -n 1p)
          DROPPED_FILES=$(echo "$CHUNK_INFO" | sed -n 2p)
          echo "dropped_files=$DROPPED_FILES" >> $GITHUB_OUTPUT
          echo "Reviewing $CHUNK_COUNT chunk(s); $DROPPED_FILES file(s) beyond the cap."

          write_prompt() {
            cat > /tmp/prompt.txt << 'EOF'
          You are a senior code reviewer. Review this PR diff and return a JSON response.

          CRITICAL: Return ONLY a single-line JSON object. No markdown, no code fences, no newlines inside the JSON, no text before or after. The response must be exactly one line starting with { and ending with }.

          Example response:
          {"verdict":"APPROVE","summary":"Code looks good","comments":[]}

          Rules:
          - verdict: "APPROVE" if no bugs/security issues, "REQUEST_CHANGES" if there are real problems
          - comments: only for actual issues (bugs, security, performance, logic errors). Empty array if code is clean.
          - line: line number from the NEW version of the file (lines with + in the diff)
          - path: relative path from repo root
          - Do NOT comment on style preferences or nitpicks
          - Keep summary under 200 characters
          - Keep each comment body under 500 characters
          - This is ONE PART of a larger PR. Judge only what is shown; do not speculate about code you cannot see.

          Diff:
          EOF
            cat "$1" >> /tmp/prompt.txt
          }

          # Recovers the JSON object from whatever the model wrapped it in.
          extract_json() {
            grep '^{' /tmp/review_raw.txt | head -1 > "$1"
            jq empty "$1" 2>/dev/null && return 0

            sed -n '/^```/,/^```/p' /tmp/review_raw.txt | grep -v '^```' | tr -d '\n' > "$1"
            jq empty "$1" 2>/dev/null && return 0

            python3 -c "
          import json, re, sys
          text = open('/tmp/review_raw.txt').read()
          match = re.search(r'\{.*\}', text, re.DOTALL)
          if match:
              try:
                  json.dump(json.loads(match.group()), sys.stdout)
              except Exception:
                  pass
          " > "$1" 2>/dev/null
            jq empty "$1" 2>/dev/null
          }

          FAILED_CHUNKS=0
          : > /tmp/all_comments.jsonl
          : > /tmp/all_summaries.txt
          WORST_VERDICT="APPROVE"

          for CHUNK in /tmp/chunks/chunk-*.diff; do
            [ -f "$CHUNK" ] || continue
            echo "--- reviewing $(basename "$CHUNK") ---"
            write_prompt "$CHUNK"

            if ! claude --print < /tmp/prompt.txt > /tmp/review_raw.txt 2>&1; then
              echo "::group::Claude CLI failure on $(basename "$CHUNK")"
              cat /tmp/review_raw.txt
              echo "::endgroup::"
              FAILED_CHUNKS=$((FAILED_CHUNKS + 1))
              continue
            fi

            if ! extract_json /tmp/chunk_review.json; then
              echo "::warning::Could not parse review JSON for $(basename "$CHUNK")"
              FAILED_CHUNKS=$((FAILED_CHUNKS + 1))
              continue
            fi

            # A single chunk asking for changes decides the whole review: a real problem
            # does not stop being real because other chunks were clean.
            if [ "$(jq -r '.verdict // "COMMENT"' /tmp/chunk_review.json)" = "REQUEST_CHANGES" ]; then
              WORST_VERDICT="REQUEST_CHANGES"
            fi

            jq -c '.comments[]? | select(.path != null and .line != null)' /tmp/chunk_review.json >> /tmp/all_comments.jsonl
            jq -r '.summary // empty' /tmp/chunk_review.json >> /tmp/all_summaries.txt
          done

          # Any chunk that could not be reviewed makes an APPROVE unsafe to claim.
          if [ "$FAILED_CHUNKS" -gt 0 ] && [ "$WORST_VERDICT" = "APPROVE" ]; then
            WORST_VERDICT="COMMENT"
          fi

          jq -n \
            --arg verdict "$WORST_VERDICT" \
            --arg summary "$(sort -u /tmp/all_summaries.txt | paste -sd' ' - | cut -c1-800)" \
            --argjson comments "$(jq -sc '.' /tmp/all_comments.jsonl)" \
            --argjson chunks "$CHUNK_COUNT" \
            --argjson failed "$FAILED_CHUNKS" \
            '{verdict: $verdict, summary: $summary, comments: $comments, chunks: $chunks, failed_chunks: $failed}' \
            > /tmp/review.json

          jq empty /tmp/review.json 2>/dev/null || \
            echo '{"verdict":"COMMENT","summary":"Review aggregation failed. Manual review recommended.","comments":[],"chunks":0,"failed_chunks":0}' > /tmp/review.json

      - name: Submit PR review
        if: steps.diff.outputs.size > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Each step runs in a fresh shell, so these cross the boundary as step outputs
          # rather than shell variables.
          DIFF_TOTAL_LINES: ${{ steps.diff.outputs.total_lines }}
          DIFF_DROPPED_FILES: ${{ steps.review.outputs.dropped_files }}
        run: |
          VERDICT=$(jq -r '.verdict // "COMMENT"' /tmp/review.json)
          SUMMARY=$(jq -r '.summary // "Review completed"' /tmp/review.json)

          if [ "$VERDICT" = "REQUEST_CHANGES" ]; then
            EVENT="REQUEST_CHANGES"
          elif [ "$VERDICT" = "APPROVE" ]; then
            EVENT="APPROVE"
          else
            EVENT="COMMENT"
          fi

          COMMENTS=$(jq -c '[.comments[]? | select(.path != null and .line != null) | {path: .path, line: (.line // 1), body: .body}]' /tmp/review.json)

          if [ "$COMMENTS" = "null" ] || [ -z "$COMMENTS" ]; then
            COMMENTS="[]"
          fi

          # Coverage is stated on every review, because a verdict is only worth what it
          # was based on. The previous version could report APPROVE having seen the first
          # 3,000 lines of a 23,699-line diff, with no way for a reader to tell.
          CHUNKS=$(jq -r '.chunks // 0' /tmp/review.json)
          FAILED=$(jq -r '.failed_chunks // 0' /tmp/review.json)
          COVERAGE_NOTE=$(python3 - "$CHUNKS" "$FAILED" "$DIFF_TOTAL_LINES" "$DIFF_DROPPED_FILES" << 'PY'
          import sys
          chunks, failed, total, dropped = (int(x or 0) for x in sys.argv[1:5])
          parts = [f"Reviewed {total} diff lines in {chunks} chunk(s)."]
          if failed:
              parts.append(f"WARNING: {failed} chunk(s) could not be reviewed — that code was not checked.")
          if dropped:
              parts.append(f"WARNING: {dropped} file(s) exceeded the chunk cap and were NOT reviewed.")
          print(" ".join(parts))
          PY
          )

          REVIEW_BODY="**Claude Review (Bedrock)**

          $SUMMARY

          _${COVERAGE_NOTE}_"

          jq -n \
            --arg body "$REVIEW_BODY" \
            --arg event "$EVENT" \
            --argjson comments "$COMMENTS" \
            --arg commit "${{ github.event.pull_request.head.sha }}" \
            '{body: $body, event: $event, comments: $comments, commit_id: $commit}' > /tmp/review_payload.json

          if ! gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --input /tmp/review_payload.json; then
            jq '.event = "COMMENT"' /tmp/review_payload.json | \
            gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews --input -
          fi
